name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bjwlxyzhuzhu/ysjs

jobs:
  image:
    name: Build, smoke test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify FFmpeg, FFprobe and application
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE:sha-$GITHUB_SHA"
          docker run --rm --entrypoint ffmpeg "$image" -version >/dev/null
          docker run --rm --entrypoint ffprobe "$image" -version >/dev/null
          docker run -d --name ysjs-smoke -p 127.0.0.1:8787:8787 "$image" >/dev/null
          trap 'docker rm -f ysjs-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/auth/setup >/tmp/ysjs-setup.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent http://127.0.0.1:8787/ | grep -q '<html'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/me)" = 401
          test "$(curl --silent -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/auth/local)" = 403

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Record published image
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo "- Image: `$IMAGE:latest`"
            echo "- Commit tag: `$IMAGE:sha-$GITHUB_SHA`"
            echo "- Digest: `$DIGEST`"
            echo "- Platform: linux/amd64"
          } >> "$GITHUB_STEP_SUMMARY"
